name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries for HEIC support
        run: sudo apt-get update && sudo apt-get install -y libheif1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The synthetic smoke test and the end-to-end pipeline test always run.
        # The per-fixture regression test in test_circle_detection skips on CI
        # because tests/fixtures/expected_circles.csv is user-specific and not
        # committed.
        run: python -m unittest discover tests -v
